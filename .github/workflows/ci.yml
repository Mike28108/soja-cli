name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Both jobs below read the private soja-backend repository. They need a repository
  # secret SOJA_REPOS_TOKEN: a fine-grained token with read access to its contents.
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: SOJA_REPOS_TOKEN is set
        env:
          TOKEN: ${{ secrets.SOJA_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret SOJA_REPOS_TOKEN (read access to Mike28108/soja-backend)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mike28108/soja-backend
          token: ${{ secrets.SOJA_REPOS_TOKEN }}
          path: other
      - run: node scripts/check-domain.mjs other

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: soja
          POSTGRES_PASSWORD: soja
          POSTGRES_DB: soja
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: SOJA_REPOS_TOKEN is set
        env:
          TOKEN: ${{ secrets.SOJA_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret SOJA_REPOS_TOKEN (read access to Mike28108/soja-backend)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mike28108/soja-backend
          token: ${{ secrets.SOJA_REPOS_TOKEN }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run test:e2e
        env:
          SOJA_BACKEND_DIR: backend
          DATABASE_URL: postgres://soja:soja@localhost:5432/soja
